name: Process Timetable & Publish OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.xlsx'
      - '**/*.xlsx'

permissions:
  contents: write

jobs:
  process-timetable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Excel Timetables into SQLite
        run: |
          python -c "
          import os, subprocess, sys
          files = [f for f in os.listdir('.') if f.endswith('.xlsx') and not f.startswith('~$')]
          files.sort(key=lambda x: (not ('latest' in x.lower() or 'master' in x.lower()), os.path.getmtime(x)))
          for f in files:
              print(f'=== Processing {f} ===')
              subprocess.run([sys.executable, 'import_timetable.py', f], check=True)
          "

      - name: Export Web Portal Data
        run: |
          python export_web_data.py

      - name: Commit and Push Updated Data & Database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A docs/ app/src/main/assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update timetable data and OTA database [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
